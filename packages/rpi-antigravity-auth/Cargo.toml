[package]
name = "rpi-antigravity-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Antigravity provider and account custody integration for rpi"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
# Ordered transcript/schema maps must still build on Rust 1.78.
indexmap = "=2.11.4"
# Newer releases require edition 2024; retain the host's Rust 1.78 baseline.
encoding_rs = "=0.8.35"
regex = "1"
url.workspace = true
http = "1"
# Reuse zlib for Node-compatible gzip validation and concatenated members.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
tokio = { workspace = true, features = ["net", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
base64 = "0.22"
percent-encoding = "2"
sha2 = "0.10"
getrandom = "0.2"
uuid = { version = "=1.20.0", features = ["v4"] }
reqwest = { workspace = true, features = ["stream"] }
# Decode only this package's responses; do not change other providers' reqwest features.
async-compression = { version = "=0.4.18", default-features = false, features = ["tokio", "brotli"] }
zstd = { version = "0.13", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["http1"] }
rpi-plugin-sdk = { git = "https://github.com/yansigit/pi-rust", rev = "63818ded388b09a7bdf4cd5fb59d20fa73f87cb1", default-features = false, features = ["provider"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
