[package]
name = "rpi-antigravity-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Antigravity provider and account custody integration for rpi"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
# Ordered transcript/schema maps must still build on Rust 1.78.
indexmap = "=2.11.4"
rpi-node-collation = { path = "../../crates/rpi-node-collation" }
# Newer releases require edition 2024; retain the host's Rust 1.78 baseline.
encoding_rs = "=0.8.35"
regex = "1"
url.workspace = true
http = "1"
# Reuse zlib for Node-compatible gzip validation and concatenated members.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
tokio = { workspace = true, features = ["net", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
percent-encoding = "2"
sha2 = "0.10"
getrandom = "0.2"
uuid = { version = "=1.20.0", features = ["v4"] }
reqwest = { workspace = true, features = ["stream"] }
# Decode only this package's responses; do not change other providers' reqwest features.
async-compression = { version = "=0.4.18", default-features = false, features = ["tokio", "brotli"] }
zstd = { version = "0.13", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["http1"] }
rpi-plugin-sdk = { git = "https://github.com/yansigit/pi-rust", rev = "e9fa88ca6af4107440ac2d518226a30838ecce00", default-features = false, features = ["provider"] }

cortexkit-claustrum-client = { path = "../../vendor/claustrum-client", default-features = false }
subc-protocol = "=0.32.8"
subc-transport = "=0.13.0"
subc-client-rs = { path = "../../vendor/subc-client-rs" }

[dev-dependencies]
icu_provider_blob = "=1.5.0"
icu_provider_adapters = { version = "=1.5.0", features = ["serde"] }
icu_normalizer = { version = "=1.5.0", features = ["serde"] }
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell"] }
