[package]
name = "rpi-multiprovider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native multi-account routing and virtual providers for rpi"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait.workspace = true
futures-util = "0.3"
rpi-node-collation = { path = "../../crates/rpi-node-collation" }
rpi-plugin-sdk = { git = "https://github.com/yansigit/pi-rust", rev = "e9c052653975c1d648092ab52e817a0b2f4b575c", default-features = false, features = ["provider"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
indexmap = "=2.11.4"
regex = "1"
getrandom = "0.2"
uuid = { version = "=1.20.0", features = ["v4"] }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
rpi-ai = { git = "https://github.com/yansigit/pi-rust", rev = "e9c052653975c1d648092ab52e817a0b2f4b575c", default-features = false }
tokio = { workspace = true, features = ["macros"] }
