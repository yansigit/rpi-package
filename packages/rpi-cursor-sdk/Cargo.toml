[package]
name = "rpi-cursor-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Cursor integration with the retained pinned Node adapter"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rpi-plugin-sdk = { git = "https://github.com/yansigit/pi-rust", rev = "1aff6a72dfd676e7a811f131d600c22f0163f54d", default-features = false, features = ["provider"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
tokio = { workspace = true, features = ["net", "io-util", "process", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
getrandom = "0.2"
fs2 = "0.4"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }
