[package]
name = "subc-client-rs"
version = "0.30.5"
edition = "2021"
publish = false
description = "Shared serve + consume client for Rust subc modules."
license = "MIT"
repository = "https://github.com/cortexkit/subconscious"

[features]
default = []
# A scripted stand-in daemon for a module's own tests. Enable it only in the
# module's [dev-dependencies] entry for subc-client-rs, never in [dependencies],
# so it can never be compiled into a shipped module.
test-support = []

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subc-control = { version = "=0.32.2" }
subc-os = { version = "=0.1.16" }
subc-protocol = { version = "=0.32.8" }
subc-transport = { version = "=0.13.0" }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
tempfile = { version = "=3.27.0", default-features = false }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "test-util"] }

[patch.crates-io]
subc-os = { path = "../subc-os" }
